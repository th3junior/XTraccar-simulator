[project]
name = "xtraccar-simulator"
version = "2.1.0"
description = "XTraccar Simulator — rotas OSRM/GPX, telemetria e painel web (protocolo OsmAnd)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.6.0",
    "gpxpy>=1.6.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
]

[project.scripts]
xtraccar-simulator = "app.main:run"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
